name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: stoneflow-backend-2024
  REGION: us-central1
  REPO_NAME: stoneflow-backend
  IMAGE_NAME: stoneflow-api
  SERVICE_NAME: stoneflow-backend

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/32069921591/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@stoneflow-backend-2024.iam.gserviceaccount.com

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE_URI" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 4000 \
            --set-env-vars "NODE_ENV=production" \
            --set-secrets "DATABASE_URL=database-url:latest" \
            --set-secrets "JWT_SECRET=jwt-secret:latest" \
            --set-secrets "TWILIO_ACCOUNT_SID=twilio-account-sid:latest" \
            --set-secrets "TWILIO_AUTH_TOKEN=twilio-auth-token:latest" \
            --set-secrets "TWILIO_WHATSAPP_FROM=twilio-whatsapp-from:latest" \
            --set-secrets "WHATSAPP_VERIFY_TOKEN=whatsapp-verify-token:latest" \
            --set-secrets "ADMIN_USERNAME=admin-username:latest" \
            --set-secrets "ADMIN_PASSWORD=admin-password:latest" \
            --set-secrets "FRONTEND_URL=frontend-url:latest" \
            --project ${{ env.PROJECT_ID }}

      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --format 'value(status.url)')
          echo "Service deployed at: $URL"
          echo "WebSocket endpoint: wss://${URL#https://}"
